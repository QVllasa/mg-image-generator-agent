services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # MAIN APPLICATION
  # ═══════════════════════════════════════════════════════════════════════════════

  room-stager:
    build: .
    container_name: room-stager
    ports:
      - "8000:8000"
    environment:
      # fal.ai
      - FAL_API_KEY=${FAL_API_KEY}
      - FAL_KEY=${FAL_API_KEY}

      # vLLM (Qwen3-VL)
      - VLLM_ENDPOINT=${VLLM_ENDPOINT:-http://host.docker.internal:8081/v1}
      - VLLM_MODEL=${VLLM_MODEL:-qwen3-vl-thinking}
      - VLLM_REQUEST_TIMEOUT=${VLLM_REQUEST_TIMEOUT:-300}

      # Server
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Limits
      - MAX_IMAGES_PER_REQUEST=${MAX_IMAGES_PER_REQUEST:-5}
      - MAX_RETRIES=${MAX_RETRIES:-2}

      # MeiliSearch
      - MEILISEARCH_PRODUCTS_URL=${MEILISEARCH_PRODUCTS_URL:-http://host.docker.internal:7700}
      - MEILISEARCH_PRODUCTS_KEY=${MEILISEARCH_PRODUCTS_KEY:-}
      - MEILISEARCH_METADATA_URL=${MEILISEARCH_METADATA_URL:-http://host.docker.internal:7701}
      - MEILISEARCH_METADATA_KEY=${MEILISEARCH_METADATA_KEY:-}
      - PRODUCTS_PER_TYPE=${PRODUCTS_PER_TYPE:-5}

      # PostgreSQL (Job Tracking)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-staging}:${POSTGRES_PASSWORD:-staging_secret}@postgres:5432/${POSTGRES_DB:-staging_jobs}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-staging}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-staging_secret}
      - POSTGRES_DB=${POSTGRES_DB:-staging_jobs}

      # MinIO (Image Storage)
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-staging-images}
      - MINIO_SECURE=false
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}

    volumes:
      - ./logs:/app/logs
      - ./test_images:/app/test_images
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════════
  # POSTGRESQL - Job Tracking Database
  # ═══════════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: room-stager-postgres
    ports:
      - "5434:5432"  # Different port to avoid conflicts with other PostgreSQL instances
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_secret}
      POSTGRES_DB: ${POSTGRES_DB:-staging_jobs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d  # Auto-run migrations on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staging} -d ${POSTGRES_DB:-staging_jobs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════════
  # MINIO - S3-Compatible Image Storage
  # ═══════════════════════════════════════════════════════════════════════════════

  minio:
    image: minio/minio:latest
    container_name: room-stager-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════════
  # MINIO INIT - Creates bucket on startup
  # ═══════════════════════════════════════════════════════════════════════════════

  minio-init:
    image: minio/mc:latest
    container_name: room-stager-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb local/${MINIO_BUCKET:-staging-images} --ignore-existing;
      mc anonymous set download local/${MINIO_BUCKET:-staging-images};
      echo 'MinIO bucket initialized successfully';
      exit 0;
      "

  # ═══════════════════════════════════════════════════════════════════════════════
  # DASHBOARD - Next.js 15 (Production build)
  # ═══════════════════════════════════════════════════════════════════════════════

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: room-stager-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - room-stager
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ═══════════════════════════════════════════════════════════════════════════════
# VOLUMES - Persistent data storage
# ═══════════════════════════════════════════════════════════════════════════════

volumes:
  postgres_data:
    name: room-stager-postgres-data
  minio_data:
    name: room-stager-minio-data

# ═══════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  default:
    name: room-stager-network
